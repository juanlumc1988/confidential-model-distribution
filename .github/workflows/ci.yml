# Fast checks on every push and pull request. Nothing here needs a secret,
# a cluster or the Hugging Face Hub.
#
# Actions are pinned by commit SHA, like the base image is pinned by digest;
# Dependabot (.github/dependabot.yml) proposes the updates.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Python version is not written here: each job reads it from the FROM line
# of the Dockerfiles (.github/scripts/python-version.sh), so lint, tests and
# lock-check always run on the interpreter of the images. The step is inside
# every job, not a shared job they depend on: a failed dependency would make
# them "skipped", which a branch ruleset counts as passing.

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python version of the images
        id: python
        run: |
          version="$(.github/scripts/python-version.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - run: shellcheck setup/*.sh .github/scripts/*.sh

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python version of the images
        id: python
        run: |
          version="$(.github/scripts/python-version.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: >
          pytest
          --cov=shared --cov=producer --cov=consumer
          --cov-report=term-missing
          --cov-fail-under=90

  lock-check:
    # Short, stable name: the branch ruleset requires these checks by name.
    name: lock-check (${{ matrix.dir }})
    # Every lock must be exactly what its requirements.in resolves to, so a
    # hand edit or a forgotten regeneration fails here. Each lock is rebuilt
    # with the command recorded in its own header: uv writes that command
    # into the file, so adding a flag would show up as a diff. The target
    # Python comes from UV_PYTHON instead, which uv does not record; the step
    # below exports it from the Dockerfiles.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: .
            lock: requirements-dev.lock
            compile: >-
              uv pip compile --python-version 3.12 --generate-hashes
              --output-file requirements-dev.lock requirements-dev.in
          - dir: producer
            lock: requirements.lock
            compile: >-
              uv pip compile --generate-hashes
              --output-file requirements.lock requirements.in
          - dir: consumer
            lock: requirements.lock
            compile: >-
              uv pip compile --generate-hashes
              --output-file requirements.lock requirements.in
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python version of the images
        id: python
        run: |
          version="$(.github/scripts/python-version.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "UV_PYTHON=${version}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python.outputs.version }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - working-directory: ${{ matrix.dir }}
        run: ${{ matrix.compile }}
      - working-directory: ${{ matrix.dir }}
        run: git diff --exit-code -- ${{ matrix.lock }}

  manifests:
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform (checksum verified)
        run: |
          curl -fsSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf kubeconform.tar.gz kubeconform
      - run: ./kubeconform -strict -summary manifests/

  docker-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [producer, consumer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Built from the repository root so shared/ can be copied in; not pushed.
      - run: docker build -f ${{ matrix.image }}/Dockerfile -t ${{ matrix.image }}:ci .
